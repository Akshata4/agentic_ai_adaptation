[project]
name = "agentic-ai-adaptation"
version = "0.1.0"
description = "Code reproduction for 'Adaptation of Agentic AI' survey (arXiv:2512.16301)"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "torch>=2.2.0",
    "accelerate>=0.28.0",
    "datasets>=2.18.0",
    "huggingface-hub>=0.22.0",
    "wikipedia>=1.4.0",
    "pyyaml>=6.0",
    # bitsandbytes is CUDA-only; safe to keep — transformers loads it lazily
    "bitsandbytes>=0.43.0",
]

[dependency-groups]
viz = [
    "matplotlib>=3.8.0",
]

[tool.uv]
dev-dependencies = []
